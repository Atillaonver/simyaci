name: ⚡ Akıllı Yayınla (Kesin Çözüm)

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  smart-deploy:
    name: 🔍 Değişen Dosyaları Yükle
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Kodu Al
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 📂 Yüklenecek Dosyaları Hazırla
        run: |
          # Geçici bir klasör oluşturup sadece değişenleri oraya kopyalayacağız
          mkdir -p deploy_temp
          
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git ls-files)
          fi

          # Filtrele ve dosyaları geçici klasöre, kendi dizin yapısıyla kopyala
          for file in $CHANGED; do
            if [ -f "$file" ]; then
              # Gereksiz dosyaları atla
              if [[ $file == .git* ]] || [[ $file == .github* ]] || [[ $file == config.php ]] || [[ $file == admin/config.php ]] || [[ $file == image/* ]]; then
                continue
              fi
              
              dest="deploy_temp/$(dirname "$file")"
              mkdir -p "$dest"
              cp "$file" "deploy_temp/$file"
            fi
          done

      - name: 📦 lftp Kur
        run: sudo apt-get install -y lftp

      - name: 📂 FTP ile Akıllı Senkronizasyon
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # lftp 'mirror' komutu en güvenli yoldur. 
          # -R: Reverse (Yerelden Sunucuya)
          # --only-newer: Sadece yeni olanları at
          # --no-empty-dirs: Boş dizin oluşturma
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 2;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            
            # --- DİKKAT: Burayı kontrol edin ---
            # Eğer FTP sizi direkt public_html içine atıyorsa burayı 'cd /' yapın.
            # Eğer FTP ana dizine (root) atıyorsa 'cd public_html' yapın.
            cd public_html; 
            #cd /;

            mirror -R deploy_temp/ ./;
            quit;
          "
          echo "✅ Dosyalar başarıyla senkronize edildi!"
