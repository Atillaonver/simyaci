name: ⚡ Akıllı Yayınla (Sadece Değişenler)

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  smart-deploy:
    name: 🔍 Değişen Dosyaları Bul ve Yükle
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Kodu Al
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Önceki commit ile karşılaştırmak için 2 commit gerekli

      - name: 🔍 Değişen Dosyaları Bul
        id: changed_files
        run: |
          echo "Değişen dosyalar tespit ediliyor..."
          # İlk commit ise tüm dosyaları al, değilse sadece değişenleri
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git ls-files)
          fi

          echo "Değişen dosyalar:"
          echo "$CHANGED"

          # Hariç tutulan dizinleri filtrele
          FILTERED=$(echo "$CHANGED" | grep -v -E '^(\.git|\.github|develope/|image/|cdn/|system/storage/|system/vendor/|node_modules/|.*cache.*)' || true)

          echo "Yüklenecek dosyalar:"
          echo "$FILTERED"

          # Boş mu kontrol et
          if [ -z "$FILTERED" ]; then
            echo "Yüklenecek değişiklik yok."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Dosya listesini kaydet
            echo "$FILTERED" > /tmp/changed_files.txt
          fi

      - name: 📦 lftp Kur
        if: steps.changed_files.outputs.has_changes == 'true'
        run: sudo apt-get install -y lftp

      - name: 📂 Sadece Değişen Dosyaları FTP ile Yükle
        if: steps.changed_files.outputs.has_changes == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              # Uzak dizini oluştur ve dosyayı yükle
              REMOTE_DIR="public_html/$(dirname "$file")"
              echo "Yükleniyor: $file → $REMOTE_DIR/"
              lftp -c "
                set ftp:ssl-allow no;
                open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
                mkdir -p $REMOTE_DIR;
                put $file -o $REMOTE_DIR/$(basename "$file");
              "
            fi
          done < /tmp/changed_files.txt
          echo "✅ Tüm değişiklikler yüklendi!"
